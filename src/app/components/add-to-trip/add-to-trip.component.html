<ion-header>
  <ion-toolbar>
    <ion-title>Reise auswählen</ion-title>
    <ion-buttons slot="end">
      <ion-button class="close-button" (click)="close()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2 class="title">Zu welcher Reise möchtest du '{{ place.name }}' hinzufügen?</h2>

  <ion-list class="custom-list">
    <ion-item class="custom-item" *ngFor="let trip of trips">
      <ion-label>{{ trip.name }}</ion-label>
      <ion-checkbox 
        slot="end" 
        [(ngModel)]="trip.selected" 
        (ionChange)="toggleSelection(trip)">
      </ion-checkbox>
    </ion-item>
  </ion-list>

  <div class="button-container">
    <ion-button expand="full" (click)="save()">Speichern</ion-button>
  </div>
</ion-content>
