<ion-content class="ion-padding">
  <div class="register-container">
    <h1 class="app-title">TripTracker</h1>

    <ion-list class="input-list">
      <ion-item class="input-box">
        <ion-input placeholder="Vorname" [(ngModel)]="firstname" (ionInput)="clearError()"></ion-input>
      </ion-item>

      <ion-item class="input-box">
        <ion-input placeholder="Nachname" [(ngModel)]="lastname" (ionInput)="clearError()"></ion-input>
      </ion-item>

      <ion-item class="input-box">
        <ion-input placeholder="Email" [(ngModel)]="email" type="email" (ionInput)="clearError()"></ion-input>
      </ion-item>

      <ion-item class="input-box">
        <ion-input placeholder="Passwort" [(ngModel)]="password" type="password" (ionInput)="clearError()"></ion-input>
      </ion-item>
      <p class="password-hint">Mindestens 6 Zeichen</p>
    </ion-list>

    <div *ngIf="error" class="error-message">{{ error }}</div>

    <ion-button expand="full" class="register-button" (click)="register()">Registrieren</ion-button>
    <p class="login-text">
      Bereits ein Konto? <a (click)="login()">Jetzt anmelden</a>
    </p>
  </div>
</ion-content>
