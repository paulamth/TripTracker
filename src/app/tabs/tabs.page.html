<ion-tabs>
  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon [name]="activatedTab === 'tab1' ? 'home' : 'home-outline'"></ion-icon>
      <ion-label>Entdecken</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon [name]="activatedTab === 'tab2' ? 'search' : 'search-outline'"></ion-icon>
      <ion-label>Suchen</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab5" href="/tabs/tab5">
      <ion-icon [name]="activatedTab === 'tab5' ? 'heart' : 'heart-outline'"></ion-icon>
      <ion-label>Merkliste</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon [name]="activatedTab === 'tab3' ? 'earth' : 'earth-outline'"></ion-icon>
      <ion-label>Planen</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" href="/tabs/tab4">
      <ion-icon [name]="activatedTab === 'tab4' ? 'person' : 'person-outline'"></ion-icon>
      <ion-label>Profil</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
